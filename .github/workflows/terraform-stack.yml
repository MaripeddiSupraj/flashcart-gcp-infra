name: terraform-stack

on:
  workflow_call:
    inputs:
      stack:
        description: "Relative path to stack containing backend.tf (e.g. stacks/01-network)"
        type: string
        required: true
      environment:
        description: "Target environment matching env/<env>.tfvars and GitHub Environment"
        type: string
        required: true
      apply:
        description: "Apply the saved plan artifact after validation"
        type: boolean
        default: false
      drift_check:
        description: "Create a GitHub drift issue if plan detects out-of-band changes"
        type: boolean
        default: false
      terraform_version:
        description: "Terraform CLI version"
        type: string
        default: "1.16.6"

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  STACK: ${{ inputs.stack }}
  ENVIRONMENT: ${{ inputs.environment }}

jobs:
  plan:
    name: plan ${{ inputs.stack }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    concurrency:
      group: tf-${{ inputs.stack }}-${{ inputs.environment }}
      cancel-in-progress: false
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      artifact: ${{ steps.names.outputs.artifact }}

    steps:
      - uses: actions/checkout@v4

      - id: names
        run: echo "artifact=tfplan-$(echo "$STACK" | tr '/' '-')-$ENVIRONMENT" >> "$GITHUB_OUTPUT"

      # Keyless OIDC login using the READ-ONLY plan Service Account
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: terraform init
        working-directory: ${{ inputs.stack }}
        run: |
          PFX="${{ vars.TF_STATE_PREFIX }}"
          terraform init \
            -backend-config="bucket=${{ vars.GCP_STATE_BUCKET }}" \
            -backend-config="prefix=${PFX:+${PFX}/}${STACK}/${ENVIRONMENT}"

      - name: fmt and validate
        working-directory: ${{ inputs.stack }}
        run: |
          terraform fmt -check -recursive
          terraform validate

      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        working-directory: ${{ inputs.stack }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ inputs.stack }}
          framework: terraform
          quiet: true
          soft_fail: true

      - name: terraform plan
        id: plan
        working-directory: ${{ inputs.stack }}
        run: |
          set +e
          terraform plan -var-file="env/${ENVIRONMENT}.tfvars" -out=tfplan -lock-timeout=5m -detailed-exitcode
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then exit 1; fi
          if [ "$code" -eq 2 ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > plan.json

      - name: conftest OPA policy check
        working-directory: ${{ inputs.stack }}
        run: |
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | tar xz conftest
          ./conftest test plan.json --policy "$GITHUB_WORKSPACE/policies" --all-namespaces

      - name: comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync(`${process.env.STACK}/plan.txt`, 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated)';
            const body = `### Terraform Plan: \`${process.env.STACK}\` (${process.env.ENVIRONMENT})\n<details><summary>View plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

      - name: open drift issue
        if: inputs.drift_check && steps.plan.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Drift detected: ${STACK} (${ENVIRONMENT})" \
            --body "Nightly plan detected out-of-band changes. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --label drift || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: |
            ${{ inputs.stack }}/tfplan
            ${{ inputs.stack }}/.terraform.lock.hcl
          retention-days: 5

  apply:
    name: apply ${{ inputs.stack }} (${{ inputs.environment }})
    needs: plan
    if: inputs.apply && needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: tf-${{ inputs.stack }}-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # Keyless OIDC login scoped strictly to this GitHub Environment's Apply SA
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: ${{ inputs.stack }}

      - name: terraform init
        working-directory: ${{ inputs.stack }}
        run: |
          PFX="${{ vars.TF_STATE_PREFIX }}"
          terraform init \
            -backend-config="bucket=${{ vars.GCP_STATE_BUCKET }}" \
            -backend-config="prefix=${PFX:+${PFX}/}${STACK}/${ENVIRONMENT}"

      - name: terraform apply saved plan
        working-directory: ${{ inputs.stack }}
        run: terraform apply -lock-timeout=5m tfplan
