name: infra

on:
  pull_request:
    paths: ["stacks/**", "modules/**", "policies/**"]
  push:
    branches: [main]
    paths: ["stacks/**", "modules/**"]
  workflow_dispatch:
    inputs:
      stack:
        description: "Stack path (e.g. stacks/01-network)"
        required: true
      environment:
        description: "dev | staging | prod"
        required: true
        default: dev
      apply:
        description: "Apply after plan"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  detect:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      dev: ${{ steps.find.outputs.dev }}
      staging: ${{ steps.find.outputs.staging }}
      prod: ${{ steps.find.outputs.prod }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: find
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          # If shared modules changed, plan all stacks; otherwise only stacks containing modified files.
          if echo "$changed" | grep -qE '^(modules|policies)/'; then
            stacks=$(find stacks -name backend.tf -exec dirname {} \; | sort -u)
          else
            stacks=$(echo "$changed" | while read -r f; do
              d=$(dirname "$f")
              while [ "$d" != "." ] && [ ! -f "$d/backend.tf" ]; do d=$(dirname "$d"); done
              [ -f "$d/backend.tf" ] && echo "$d"
            done | sort -u)
          fi

          pairs=$(for s in $stacks; do
            for f in "$s"/env/*.tfvars; do
              [ -f "$f" ] && jq -cn --arg s "$s" --arg e "$(basename "$f" .tfvars)" '{stack:$s, environment:$e}'
            done
          done | jq -cs .)

          echo "dev=$(echo "$pairs" | jq -c '[.[] | select(.environment == "dev")]')" >> "$GITHUB_OUTPUT"
          echo "staging=$(echo "$pairs" | jq -c '[.[] | select(.environment == "staging")]')" >> "$GITHUB_OUTPUT"
          echo "prod=$(echo "$pairs" | jq -c '[.[] | select(.environment == "prod")]')" >> "$GITHUB_OUTPUT"

  dev:
    needs: detect
    if: needs.detect.result == 'success' && needs.detect.outputs.dev != '' && needs.detect.outputs.dev != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.dev || '[]') }}
    uses: ./.github/workflows/terraform-stack.yml
    with:
      stack: ${{ matrix.stack }}
      environment: ${{ matrix.environment }}
      apply: ${{ github.event_name == 'push' }}

  staging:
    needs: [detect, dev]
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.staging != '' && needs.detect.outputs.staging != '[]' && (needs.dev.result == 'success' || needs.dev.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.staging || '[]') }}
    uses: ./.github/workflows/terraform-stack.yml
    with:
      stack: ${{ matrix.stack }}
      environment: ${{ matrix.environment }}
      apply: ${{ github.event_name == 'push' }}

  prod:
    needs: [detect, staging]
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.prod != '' && needs.detect.outputs.prod != '[]' && (needs.staging.result == 'success' || needs.staging.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.prod || '[]') }}
    uses: ./.github/workflows/terraform-stack.yml
    with:
      stack: ${{ matrix.stack }}
      environment: ${{ matrix.environment }}
      apply: ${{ github.event_name == 'push' }}

  manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/terraform-stack.yml
    with:
      stack: ${{ inputs.stack }}
      environment: ${{ inputs.environment }}
      apply: ${{ inputs.apply }}
